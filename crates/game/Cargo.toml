[package]
name = "game"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The b.java shell: mode state machine, main loop, menus — validated by screenshot parity against the real bytecode on FreeJ2ME."

[lints]
workspace = true

# The playable window (`play`) is opt-in like render's map-view: the default
# build stays headless (no GPU/display needed for the parity suites).
[features]
default = []
interactive = ["dep:macroquad"]
# Every integration test in this crate drives the shell against captured
# ground truth in `tests/fixtures/`, which is derived from the original game
# and is not distributed. Without that directory the suites cannot run, so
# they are opt-in: `cargo test -p game --features fixtures`.
fixtures = []

[[bin]]
name = "play"
path = "src/bin/play.rs"
required-features = ["interactive"]

