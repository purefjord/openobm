[package]
name = "eso-tools"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Dumpers that emit byte-comparable ground-truth for diffing against the FreeJ2ME oracle."

[lints]
workspace = true

# `assets` = you have extracted your own copy of the game into ./assets.
# `fixtures` = you also have tests/fixtures/, the captured ground truth, which
# is derived from the original game and is not distributed.
[features]
default = []
assets = []
fixtures = ["assets"]

[[bin]]
name = "eso-dump"
path = "src/main.rs"

[[test]]
name = "golden"
required-features = ["assets"]

[[test]]
name = "oracle_match"
required-features = ["fixtures"]

[dependencies]
formats.workspace = true
anyhow.workspace = true

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
proptest = "1"
